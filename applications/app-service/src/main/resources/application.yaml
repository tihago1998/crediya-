server:
  port: 8080
spring:
  application:
    name: "crediya"
  devtools:
    add-properties: false
  profiles:
    include: null
  # Conexión a PostgreSQL.
  # Los valores se leen de variables de entorno (definidas en docker-compose / .env);
  # si no existen, se usan los valores por defecto para ejecutar en local (localhost:5432).
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crediya}"
    username: "${DB_USER:crediya}"
    password: "${DB_PASSWORD:crediya}"
    driverClassName: "org.postgresql.Driver"
  jpa:
    # Dialecto de Hibernate para generar SQL compatible con PostgreSQL
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
